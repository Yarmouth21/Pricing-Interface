spring.application.name=pricer-api

# Path to the compiled C++ pricing engine binary (see ../cpp-engine).
# Overridable via env var PRICING_ENGINE_BINARY_PATH (Docker sets it to /app/pricer_cli).
pricing.engine.binary-path=${PRICING_ENGINE_BINARY_PATH:../cpp-engine/pricer_cli}
pricing.engine.timeout-seconds=${PRICING_ENGINE_TIMEOUT_SECONDS:30}

pricing.cors.allowed-origin=${PRICING_CORS_ALLOWED_ORIGIN:http://localhost:4200}

management.endpoints.web.exposure.include=health,info

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp-engine:
    name: Build & smoke-test C++ engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile pricer_cli
        working-directory: cpp-engine
        run: g++ -std=c++17 -O2 -Wall -o pricer_cli pricer_cli.cpp

      - name: Smoke test — Black-Scholes matches the known analytical price
        working-directory: cpp-engine
        run: |
          output=$(./pricer_cli --method=bs --type=call --s0=100 --k=100 --r=0.05 --vol=0.2 --t=1.0)
          echo "$output"
          echo "$output" | grep -q '10.450584' || (echo "unexpected price" && exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: pricer_cli
          path: cpp-engine/pricer_cli

  backend:
    name: Backend — build & JUnit tests
    needs: cpp-engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pricer_cli
          path: cpp-engine

      - name: Make pricer_cli executable
        run: chmod +x cpp-engine/pricer_cli

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw -B test

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend — build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Run unit tests
        working-directory: frontend
        run: npx ng test --watch=false

  docker-publish:
    name: Build & push Docker images
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pricer-backend:latest
            ghcr.io/${{ github.repository_owner }}/pricer-backend:${{ github.sha }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pricer-frontend:latest
            ghcr.io/${{ github.repository_owner }}/pricer-frontend:${{ github.sha }}
